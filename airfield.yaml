kind: package
name: leg_detector
dependencies:
- ament_cmake
- rosidl_default_generators
- rosidl_default_runtime
- sensor_msgs
- tf2
- tf2_geometry_msgs
- tf2_ros
- nav_msgs
- geometry_msgs
- std_msgs
